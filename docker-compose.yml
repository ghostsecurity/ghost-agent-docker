# Ghost Agent Platform - self-hosted docker-compose deployment.
#
# From this directory, run `docker compose pull && docker compose up
# -d`. Variables are read from `.env` (copy `.env.example` and fill
# in the required values). Configs (`config.toml`,
# `config.proxy.toml`, `Caddyfile`) are bind-mounted from this
# directory - copy the corresponding `.example` templates and edit
# before bringing the stack up.
#
# Host prereqs:
#
#   1. `docker login -u <dh-org> -p <oat>` once on the host as the
#      user that will run docker compose. This is what lets the
#      initial `docker compose pull` (and subsequent updates from
#      the in-stack updater) authenticate against Docker Hub.
#
#   2. The Caddyfile flavor you pick (auto-LE vs BYO-cert) must
#      match your environment. See README.md.
#
# In-stack upgrades are driven by the exo-updater container, which
# polls Docker Hub for new release tags using the OAT in
# EXO_UPDATER_OCI_AUTH_TOKEN. The same OAT that authenticated the
# host's `docker login` above is fine here.

# Pin the compose project name so host invocations (`docker compose` from
# whatever directory the operator cloned into) AND the in-stack updater's
# invocations resolve to the SAME project. The updater bind-mounts this
# directory at /opt/exo and runs `docker compose -f /opt/exo/docker-compose.yml`,
# so without a pin it derives the project name "exo" while the host derives
# it from the deploy directory (e.g. "ghost-agent-docker"). That mismatch
# makes the updater's per-run worker recycle try to *create* the fixed-subnet
# `internal` network under its own project name, which collides with the
# host's already-running network ("Pool overlaps with other one on this
# address space") and the recreate fails — leaving fewer workers than
# WORKER_REPLICAS. Pinning to "exo" (what the updater's /opt/exo path yields)
# makes both sides agree so the recycle reuses the existing network.
name: exo

services:
  # Oneshot that normalizes ownership on the shared TLS + artifacts
  # volumes before any long-running service mounts them, then exits
  # (`restart: "no"`). Docker seeds a named volume's ownership from the
  # image mount-point only on first creation, so on an UPGRADE the
  # volumes keep their old root ownership and the now-non-root gateway /
  # proxy / worker (UID 65532) can't read or write them. This root
  # oneshot chowns them on every `up -d`; a fresh install is a near
  # no-op. Mirrors the ui-extract oneshot pattern - the long-running
  # service images stay non-root.
  #   tls         private keys, 0700, read by gateway + proxy + updater
  #   tls-public  world-readable (0755) - worker reads ca.crt as its agent user
  #   artifacts   2775 setgid so files written by the gateway (65532) and
  #               the worker's agent user (supplementary group 65532) stay
  #               mutually readable
  volume-init:
    image: busybox
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        chown -R 65532:65532 /tls /tls-public /artifacts
        chmod 0700 /tls
        chmod 0755 /tls-public
        chmod 2775 /artifacts
    volumes:
      - tls:/tls
      - tls-public:/tls-public
      - artifacts:/artifacts

  gateway:
    image: ${REGISTRY:-docker.io/ghostsecurityhq}/exo-server:${TAG}
    restart: unless-stopped
    command: [ "-config", "/etc/exo/config.toml" ]
    environment:
      # FIPS 140-3 mode. GOFIPS140 selects the validated crypto
      # module at build time; GODEBUG=fips140=on activates it at
      # runtime; EXO_REQUIRE_FIPS makes startup fatal if FIPS isn't
      # active.
      GOFIPS140: latest
      GODEBUG: fips140=on
      EXO_REQUIRE_FIPS: "true"
      # Gateway secrets injected from .env rather than config.toml, so
      # config.toml stays non-secret (world-readable) and the gateway can
      # run as its non-root default user. config.Load prefers these over
      # the blank values in config.toml.
      EXO_JWT_SECRET: ${EXO_JWT_SECRET:?EXO_JWT_SECRET must be set in .env}
      EXO_SEED_ADMIN_PASSWORD: ${EXO_SEED_ADMIN_PASSWORD:?EXO_SEED_ADMIN_PASSWORD must be set in .env}
      # Channel connectors. Set in `.env` when wiring Slack; empty
      # defaults keep compose substitution from blowing up.
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      # In-stack updater so the gateway's per-run worker-recycle RPC
      # has somewhere to land + the UI's "Upgrade" button works.
      UPDATER_URL: https://exo-updater:8080
      SYSTEM_UPGRADE_ENABLED: "true"
    volumes:
      - ./config.toml:/etc/exo/config.toml:ro
      - artifacts:/var/lib/exo/artifacts
      - tls:/var/lib/exo/tls
    networks:
      internal:
        ipv4_address: 172.28.0.11
      database:
      external:
    depends_on:
      volume-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      credential-proxy:
        condition: service_started

  # Only component with ENCRYPTION_KEY. Holds the MITM CA private
  # key and the service CA private key. NOT reachable from outside
  # the host: the MITM (:443), control plane (:8444), and DNS (:53)
  # listeners are bridge-only.
  credential-proxy:
    image: ${REGISTRY:-docker.io/ghostsecurityhq}/exo-credential-proxy:${TAG}
    restart: unless-stopped
    command: [ "-config", "/etc/exo/config.proxy.toml" ]
    # The proxy runs as the non-root UID 65532 but binds the privileged
    # ports :443 (MITM) and :53 (DNS). Lowering the unprivileged-port floor
    # to 0 lets it bind them without CAP_NET_BIND_SERVICE or root.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env (generate with `openssl rand -base64 32`)}
      GOFIPS140: latest
      GODEBUG: fips140=on
      EXO_REQUIRE_FIPS: "true"
    volumes:
      - ./config.proxy.toml:/etc/exo/config.proxy.toml:ro
      - tls:/var/lib/exo/tls
      - tls-public:/var/lib/exo/tls-public
    networks:
      # Fixed IP - workers' `dns:` directive depends on this and
      # must match [proxy].dns_proxy_ip in config.proxy.toml.
      internal:
        ipv4_address: 172.28.0.10
      database:
      external:
    depends_on:
      volume-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  database:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set (rs0) - required for the change
    # streams the gateway tails on db.run_events.watch() for live
    # UI updates.
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    volumes:
      - mongo-data:/data/db
    networks:
      - database
    # Healthcheck doubles as one-time rs.initiate() bootstrap
    # (idempotent on subsequent boots).
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh --quiet --eval '
            try { rs.status() } catch (e) {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]});
            }
          ' && mongosh --quiet --eval 'db.hello().isWritablePrimary'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker:
    image: ${REGISTRY:-docker.io/ghostsecurityhq}/exo-worker:${TAG}
    restart: unless-stopped
    cap_drop:
      - ALL
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      EXO_RUNNER_WS_URL: wss://gateway:8000/api/v1/runners/connect
      EXO_RUNNER_WORKER_TYPES: general
      EXO_RUNNER_CAPABILITIES: task
      EXO_RUNNER_SESSION_ROOT: /run/exo
      EXO_ARTIFACT_ROOT: /var/lib/exo/artifacts
      EXO_AGENT_EXTRA_CA_CERTS: /var/lib/exo/tls/ca.crt
      EXO_RUNNER_IDENTITY_DIR: /var/lib/exo/runner-identity
    # ALL hostname lookups go through the credential proxy's DNS
    # server. Public hostnames resolve to the proxy and land at the
    # MITM listener; stack-internal names forward to Docker's
    # embedded DNS. The primary mechanism by which arbitrary SDKs
    # get their credential swapped without an HTTPS_PROXY escape
    # hatch.
    dns:
      - 172.28.0.10
    volumes:
      - artifacts:/var/lib/exo/artifacts
      # Worker sees ONLY the public CA cert - never the signing
      # key. tls-public mounts at /var/lib/exo/tls inside the
      # container to match EXO_AGENT_EXTRA_CA_CERTS above.
      - tls-public:/var/lib/exo/tls:ro
      - runner-identity:/var/lib/exo/runner-identity
    networks:
      - internal
    depends_on:
      volume-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
      credential-proxy:
        condition: service_started

  # UI-driven container upgrade dispatcher. Only component that
  # holds the host's docker socket. Listens on the internal bridge
  # only - the gateway is the only thing that dials it, and the
  # network's `internal: true` plus the updater's mTLS gate (CN
  # must match `gw_<ulid>`) keep it unreachable from anything
  # else.
  #
  # UPDATER_TAG is intentionally separate from TAG: every TAG bump
  # via `docker compose up -d` skips the updater itself (so the
  # container running the upgrade doesn't get recreated mid-
  # flight). Bump the updater image out of band:
  #
  #   sed -i 's/^UPDATER_TAG=.*/UPDATER_TAG=vX.Y.Z/' .env
  #   docker compose up -d exo-updater
  exo-updater:
    image: ${REGISTRY:-docker.io/ghostsecurityhq}/exo-updater:${UPDATER_TAG:-${TAG}}
    restart: unless-stopped
    # Entrypoint shim runs once per container start: `docker login`
    # using the OAT so the in-container docker CLI has Docker Hub
    # auth for the `docker compose pull` that fires during UI-driven
    # upgrades. Doing it here rather than relying on a host
    # ~/.docker/config.json bind-mount keeps the updater self-
    # contained - no dependency on the host's credential helper
    # situation. `${REGISTRY##*/}` strips everything up to the
    # last `/` to extract the Docker Hub org (e.g. `ghostsecurityhq`).
    entrypoint: [ "/bin/sh", "-c" ]
    # The image ships a non-root default user, but this container holds the
    # host docker socket — which is root-equivalent (it can launch a
    # privileged container) — so running the process as non-root buys no
    # real isolation while complicating the in-container `docker login` and
    # the .env rewrite inside the bind-mounted /opt/exo. Run it as root
    # explicitly; the non-root image default still satisfies Scout's policy.
    user: "0:0"
    command:
      - |
        set -e
        DH_ORG="$${REGISTRY##*/}"
        printf '%s' "$$EXO_UPDATER_OCI_AUTH_TOKEN" | docker login -u "$$DH_ORG" --password-stdin
        exec /updater -config /etc/exo/config.toml
    environment:
      GOFIPS140: latest
      GODEBUG: fips140=on
      EXO_REQUIRE_FIPS: "true"
      # REGISTRY is read by the entrypoint shim above to derive the
      # Docker Hub org for `docker login`.
      REGISTRY: ${REGISTRY:-docker.io/ghostsecurityhq}
      # Docker Hub OAT - used both by the entrypoint shim for
      # `docker login` and by the OCI registry-polling backend
      # configured in config.toml ([updater] registry_type = "oci").
      EXO_UPDATER_OCI_AUTH_TOKEN: ${EXO_UPDATER_OCI_AUTH_TOKEN:?EXO_UPDATER_OCI_AUTH_TOKEN must be set in .env (Docker Hub OAT with read on the exo-* repos)}
    volumes:
      # The updater's own config lives at /etc/exo/config.toml.
      # Mounting the parent directory (./) rather than the
      # individual .env file is deliberate: the updater's atomic
      # .env rewrite uses rename(2), and Linux refuses rename over
      # a single-file bind mount (EBUSY). Mounting the parent
      # directory keeps the rename inside the bind, which works.
      - ./config.toml:/etc/exo/config.toml:ro
      - ./:/opt/exo
      - /var/run/docker.sock:/var/run/docker.sock
      - tls:/var/lib/exo/tls
    networks:
      # Fixed IP on the internal bridge so the gateway's
      # UPDATER_URL hostname resolves predictably. The `external`
      # network is required for outbound HTTPS to Docker Hub
      # (tags/list polling + image pulls) - `internal: true`
      # blocks both.
      internal:
        ipv4_address: 172.28.0.12
      external:
    depends_on:
      # service_started (not service_healthy): the credential-
      # proxy writes updater.crt + updater.key synchronously during
      # its own startup, but the depends_on contract is "container
      # exists", not "ready". A startup check inside the updater
      # turns a missing cert into a clean fatal, which docker's
      # restart policy resolves after ~1 cycle.
      credential-proxy:
        condition: service_started

  # Public TLS terminator + static UI server + /api reverse proxy.
  # The only service in this compose that publishes host ports.
  # Caddyfile flavor (auto-LE vs BYO-cert) is an operator choice:
  # copy either Caddyfile.letsencrypt.example or Caddyfile.byo.example
  # to Caddyfile before bringing the stack up.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional bind for BYO-cert deployments. Operators using
      # Caddyfile.byo.example place their cert + key here.
      # Harmless when empty - the auto-LE Caddyfile doesn't read
      # it.
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-ui:/srv/ui:ro
    networks:
      - internal
      - external
    depends_on:
      gateway:
        condition: service_started

  # Oneshot that copies the static UI bundle out of the exo-ui
  # image into the shared volume Caddy reads from. Runs once on
  # each `up -d`, then exits. `restart: "no"` keeps it from
  # looping.
  ui-extract:
    image: ${REGISTRY:-docker.io/ghostsecurityhq}/exo-ui:${TAG}
    # The exo-ui image now defaults to the non-root nginx-unprivileged user
    # (UID 101). This throwaway oneshot writes the caddy-ui named volume,
    # which Docker seeds root-owned, so run the copy as root. The non-root
    # image default still satisfies Scout's policy; nothing long-running
    # uses this image.
    user: "0:0"
    command: [ "/bin/sh", "-c", "cp -rT /usr/share/nginx/html /srv/ui" ]
    restart: "no"
    volumes:
      - caddy-ui:/srv/ui

networks:
  # Stack-internal traffic. `internal: true` blocks external
  # egress, forcing worker outbound HTTPS through the credential-
  # proxy. gateway and credential-proxy hold fixed IPs for stable
  # DNS and for the worker's `dns:` directive.
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  database:
    driver: bridge
  external:
    driver: bridge

volumes:
  # MongoDB data directory.
  mongo-data:
  # Run artifacts (logs, outputs).
  artifacts:
  # Private TLS material: ca.{crt,key}, server.{crt,key},
  # service-ca.{crt,key}, updater.{crt,key}. Mounted by the
  # credential-proxy (which generates it on first boot), the
  # gateway (reads server.* and service-ca.crt), and the updater
  # (reads its own cert pair). NEVER mounted by the worker - no
  # private key should ever reach a workload container.
  tls:
  # Public CAs only: the credential-proxy publishes ca.crt and
  # service-ca.crt here on startup so downstream services can
  # trust the cert chain without read access to the signing keys.
  # Mounted read-only by the worker.
  tls-public:
  # Runner identity pool (one subdir per runner_id, each gated by
  # its own advisory flock). Shared across scaled worker replicas
  # - the lock discipline guarantees two workers never use the
  # same identity concurrently.
  runner-identity:
  # Caddy state - Let's Encrypt account + issued cert material
  # persists here across restarts so LE doesn't re-issue on every
  # boot. Unused on the BYO-cert path.
  caddy-data:
  caddy-config:
  # Static UI bundle, populated by the ui-extract oneshot and
  # served by Caddy.
  caddy-ui:
